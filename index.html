
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            line-height: 1.6;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>
            This is my first website built using HTML and CSS.
        </p>

        <p>
            I am learning how to create and publish websites.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>
    </div>

    <script>
        function showMessage() {
            alert("Welcome! My website is working.");
        }
    </script>
</body>
</html>
